name: fetch-covers
on:
  push:
    paths: ["tools/covers.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_covers.py $(cat tools/covers.txt)
      - run: |
          git config user.name "Blogstar"
          git config user.email "blogstar@users.noreply.github.com"
          git add media/xeber/raw || true
          git commit -m "covers: raw frames" || echo nothing
          git push
